name: Harness evidence guard
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  evidence-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject tracked execution artifacts
        run: node .agents/scripts/evidence-guard.mjs --tracked
      - name: Reject artifacts in intermediate PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node .agents/scripts/evidence-guard.mjs --commits "origin/$BASE_REF" HEAD
      - name: Test guard and installer with coverage gates
        run: npm exec --yes --package=c8@12.0.0 -- c8 --check-coverage --lines=80 --branches=80 --functions=80 --statements=80 --include=.agents/scripts/evidence-guard.mjs --include=.agents/scripts/install-evidence-guard.mjs --reporter=text --reporter=json-summary --reports-dir=.artifacts/evidence-guard/coverage node --test .agents/scripts/evidence-guard.test.mjs
      - name: Preserve test outputs outside Git
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-guard-coverage
          path: .artifacts/evidence-guard/
          retention-days: 7
          if-no-files-found: ignore
